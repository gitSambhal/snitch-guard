name: Build & Release Multi-Platform Binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Multi-Platform Native Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build React Frontend
        run: npm run build

      - name: Install Neutralinojs CLI
        run: npm install -g @neutralinojs/neu

      - name: Build Multi-Platform Elevated Go Daemon
        run: |
          mkdir -p bin/daemons
          cd daemon

          echo "==> Resolving Go dependencies..."
          rm -f go.sum
          go mod tidy
          go mod download

          echo "==> Compiling Go daemon for Linux (AMD64)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/daemons/snitchguard-daemon-linux-amd64 .

          echo "==> Compiling Go daemon for Linux (ARM64)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../bin/daemons/snitchguard-daemon-linux-arm64 .

          echo "==> Compiling Go daemon for macOS (Intel AMD64)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/daemons/snitchguard-daemon-darwin-amd64 .

          echo "==> Compiling Go daemon for macOS (Apple Silicon ARM64)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../bin/daemons/snitchguard-daemon-darwin-arm64 .

          echo "==> Compiling Go daemon for Windows (AMD64)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/daemons/snitchguard-daemon-windows-amd64.exe .

          cd ..
          chmod +x bin/daemons/* || true
          ls -la bin/daemons/

      - name: Build Neutralino Desktop Single-File Binaries
        run: |
          mkdir -p dist/js dist/icons dist/bin
          cp public/js/neutralino.js dist/js/neutralino.js 2>/dev/null || true
          cp public/icons/appIcon.png dist/icons/appIcon.png 2>/dev/null || true
          cp bin/daemons/* dist/bin/ 2>/dev/null || true
          echo "==> Running neu update to download official Neutralino engine binaries..."
          neu update
          echo "==> Running neu build with --embed-resources for single-file portable binaries..."
          neu build --release --embed-resources
          ls -la bin/

      - name: Package Single Portable Binaries
        run: |
          mkdir -p release-artifacts
          
          # Copy self-contained single binaries (embedded with UI & resources)
          cp bin/snitchguard/snitchguard-linux_x64 release-artifacts/snitchguard-linux-x64 2>/dev/null || cp bin/snitchguard-linux_x64 release-artifacts/snitchguard-linux-x64 2>/dev/null || true
          cp bin/snitchguard/snitchguard-linux_arm64 release-artifacts/snitchguard-linux-arm64 2>/dev/null || cp bin/snitchguard-linux_arm64 release-artifacts/snitchguard-linux-arm64 2>/dev/null || true
          cp bin/snitchguard/snitchguard-mac_x64 release-artifacts/snitchguard-mac-x64 2>/dev/null || cp bin/snitchguard-mac_x64 release-artifacts/snitchguard-mac-x64 2>/dev/null || true
          cp bin/snitchguard/snitchguard-mac_arm64 release-artifacts/snitchguard-mac-arm64 2>/dev/null || cp bin/snitchguard-mac_arm64 release-artifacts/snitchguard-mac-arm64 2>/dev/null || true
          cp bin/snitchguard/snitchguard-win_x64.exe release-artifacts/snitchguard-windows-x64.exe 2>/dev/null || cp bin/snitchguard-win_x64.exe release-artifacts/snitchguard-windows-x64.exe 2>/dev/null || true

          chmod +x release-artifacts/snitchguard-linux-* release-artifacts/snitchguard-mac-* 2>/dev/null || true

          # Compute SHA-256 Checksums
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cd ..
          echo "==> Release Single Artifacts:"
          ls -la release-artifacts/

      - name: Determine Release Tag & Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            DATE_STR=$(date +'%Y.%m.%d')
            TAG_NAME="v1.0.0-${DATE_STR}-${SHORT_SHA}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=SnitchGuard ${TAG_NAME} - Automated Multi-Platform Release" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG_NAME }}
          name: ${{ steps.release_info.outputs.RELEASE_TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🛡️ SnitchGuard Multi-Platform Binary Release
            **Author:** Suhail Akhtar ([https://suhail.top](https://suhail.top))

            Automated cross-platform production release containing the unified Neutralinojs desktop client and the elevated Go firewall daemon.

            #### 📦 Single Portable Executables
            - **Linux x86_64:** `snitchguard-linux-x64` (Single portable binary)
            - **Linux ARM64:** `snitchguard-linux-arm64` (Single portable binary)
            - **macOS Intel (x86_64):** `snitchguard-mac-x64` (Single portable binary)
            - **macOS Apple Silicon (ARM64):** `snitchguard-mac-arm64` (Single portable binary)
            - **Windows x86_64:** `snitchguard-windows-x64.exe` (Single portable executable)
            - **Checksums:** `SHA256SUMS.txt`

            #### 🚀 Quick Start
            Each executable binary is completely self-contained with embedded web UI, client resources, and native firewall logic.
            - **Linux / macOS:** `chmod +x snitchguard-<os>-<arch> && ./snitchguard-<os>-<arch>`
            - **Windows:** Double click `snitchguard-windows-x64.exe`
          files: |
            release-artifacts/snitchguard-linux-x64
            release-artifacts/snitchguard-linux-arm64
            release-artifacts/snitchguard-mac-x64
            release-artifacts/snitchguard-mac-arm64
            release-artifacts/snitchguard-windows-x64.exe
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
